<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TECHIE</title>
</head>
<body>
  <!-- NAVBAR -->
    <header class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">TechWave</h1>

    <ul class="hidden md:flex space-x-8 text-gray-300">
        <li><a href="#"></a>Home</a></li>
        <li><a href="#"></a>Episodes</a></li>
        <li><a href="#"></a>About</a></li>
        <li><a href="#"></a>Contact</a></li>

    <button class="hidden md:block px-6 py-2 rounded-full bg-gradient-to-r from-purple-500 to-pink-500">

    <div class="md:hidden text-2xl">☰</div>
    Subscribe
  </button>
    </header>
    <!-- HERO SECTION -->
    <section class="relative bg-[url('./assets/images/banner-bg.jpg')] bg-cover bg-center py-20">

    <div class="relative inline-block mb-6">

</section>
<!--about section-->

    <div>

    </div>
    <div>

    </div>
  </div>

</section>
